name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: UI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: UI/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run interaction tests
        run: npm test
      - name: Check TypeScript
        run: npm run typecheck

  placement:
    name: Placement math tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '9.0.x'
      - name: Download Unity Mathematics 1.3.2
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://packages.unity.com/com.unity.mathematics/-/com.unity.mathematics-1.3.2.tgz \
            --output "$RUNNER_TEMP/unity-mathematics.tgz"
          echo "46ceff30191fe11f8e6f4379677885694148bc7c510d9a08e7b07e05d09b8332  $RUNNER_TEMP/unity-mathematics.tgz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/unity-mathematics"
          tar -xzf "$RUNNER_TEMP/unity-mathematics.tgz" -C "$RUNNER_TEMP/unity-mathematics"
      - name: Run placement tests
        run: >-
          dotnet test Tests/BrandTheBuilding.Tests.csproj
          --configuration Release
          --verbosity minimal
          -p:UnityMathematicsSource="$RUNNER_TEMP/unity-mathematics/package/Unity.Mathematics"
